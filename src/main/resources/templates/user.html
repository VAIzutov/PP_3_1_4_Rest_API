<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <style>
        .navbar-dark {
            background-color: #2d2d2d;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 56px;
            left: 0;
            width: 200px;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            padding-top: 20px;
        }
        .content {
            margin-left: 200px;
            padding: 20px;
        }
        .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }
        .logout-btn {
            color: #6c757d !important;
            background: none !important;
            border: none !important;
            padding: 0.25rem 0.5rem !important;
        }
        .logout-btn:hover {
            color: #495057 !important;
            background: rgba(0,0,0,0.05) !important;
            text-decoration: none !important;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand" id="userInfo">Loading...</span>
        <div class="ms-auto">
            <form action="/logout" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm logout-btn">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="sidebar">
    <ul class="nav flex-column">
        <li id="adminLinkItem" class="nav-item d-none">
            <a class="nav-link" href="/admin">Admin</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="#">
                <span id="sidebarRole">User</span>
            </a>
        </li>
    </ul>
</div>

<div class="content">
    <h1>User information-page</h1>

    <div class="card mt-3">
        <div class="card-header">
            About user
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
                </thead>
                <tbody id="userTableBody">
                <tr>
                    <td colspan="6" class="text-center">Loading...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async function () {
        try {
            const response = await fetch('/api/users/current');
            if (!response.ok) throw new Error('Failed to load user');
            const user = await response.json();
            const isAdmin = user.roles.some(role => role.name === 'ADMIN');
            if (isAdmin) {
                document.getElementById('adminLinkItem').classList.remove('d-none');
            }

            // Заполняем шапку
            const rolesStr = user.roles.map(r => r.name).join(', ');
            document.getElementById('userInfo').textContent = `${user.username} with roles: ${rolesStr}`;

            // Заполняем sidebar
            const firstRole = user.roles[0]?.name || 'User';
            document.getElementById('sidebarRole').textContent = firstRole.charAt(0).toUpperCase() + firstRole.slice(1).toLowerCase();

            // Заполняем таблицу
            const tr = `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.surname}</td>
                    <td>${user.age}</td>
                    <td>${user.username}</td>
                    <td>${rolesStr}</td>
                </tr>
            `;
            document.getElementById('userTableBody').innerHTML = tr;

        } catch (error) {
            console.error('Error loading user:', error);
            document.getElementById('userInfo').textContent = 'Error loading user data';
            document.getElementById('userTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load user info</td></tr>';
        }
    });
</script>

</body>
</html>
